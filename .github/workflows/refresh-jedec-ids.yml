# Keeps the SPI flash chip catalogue (src/firmware/uefi/jedecIds.ts) current:
# pulls the upstream file it is a translation of, re-runs the conversion, and,
# only when the table changed and the checks still pass, opens a pull request
# for someone to read. Never a commit to main, never a PR with no diff.
#
# Needs "Allow GitHub Actions to create and approve pull requests" under
# Settings ▸ Actions ▸ General. A PR opened with GITHUB_TOKEN does not start
# other workflows, which is fine: this job already ran the checks.
name: Refresh flash chip catalogue

on:
  schedule:
    - cron: "39 5 * * 1"   # Mondays, 05:39 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull the upstream table
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/maxshevelev/ByteRipper/main/Packages/UEFIImage/Sources/UEFIImage/JedecIDs.swift \
            -o JedecIDs.swift

      - name: Regenerate the table
        run: python3 Skills/update-jedec-ids/scripts/gen_jedec_web.py JedecIDs.swift

      - name: Stop when nothing changed
        id: diff
        run: |
          if git diff --quiet -- src/firmware/uefi/jedecIds.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A truncated read or a changed upstream layout fails here, or in the
      # converter's floor, and no PR is opened.
      - name: Check
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run test

      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=automation/refresh-jedec-ids
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add src/firmware/uefi/jedecIds.ts
          git commit -m "Refresh the flash chip catalogue from upstream"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --head "$branch" --base main \
              --title "Refresh the flash chip catalogue" \
              --body "Regenerated by \`Skills/update-jedec-ids/scripts/gen_jedec_web.py\` from upstream's \`JedecIDs.swift\`. Read the diff: new chips appear as lines, a rename as a changed one; a diff that removes most of the file is a read that went wrong. The checks passed. If a per-source count in \`testTheChipCatalogueIsComplete\` moved, update it in this PR."
          fi
